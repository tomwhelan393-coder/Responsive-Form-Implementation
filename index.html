<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="custom.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="row">
                <div class="col-4">
                    <img src="EduMax_logo.png" alt="EduMax logo" class="image img-fluid p-2">
                </div>
                <div class="col-5 d-flex justify-content-center align-items-center">
                    <h1 class="header">EduMax Admin View</h1>
                </div>
                <div class="col-3 text-end">
                    <a class="btn btn-primary m-2 p- btn-lg" role="button">Login</a>
                </div>
            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg p-2 bg-dark" data-bs-theme="dark">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link">Home</a>
                    <a class="nav-link">Module Catologue</a>
                    <a class="nav-link">Learning Events</a>
                    <a class="nav-link ">Membership</a>
                    <a class="nav-link ">News</a>
                    <a class="nav-link" aria-current="page">Announcments</a>
                    <a class="nav-link">Security</a>
                </div>
            </div>
            <form class="d-flex" role="search" data-bs-theme="light">
                <input class="form-control me-2 p-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-secondary" type="submit">Search</button>
            </form>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <main>
        <div class="container">
            <h1>Edit Announcment</h1>
            <form>
                <div class="row mb-3">
                    <label for="inputSendersName" class="col-sm-2 col-form-label">Senders Name</label>
                    <div class="col">
                        <input type="text" class="form-control" id="inputSendersName" placeholder="First Name"
                            aria-label="First Name" value="Jane">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="inputSendersName" placeholder="Last Name"
                            aria-label="Last Name" value="Couch">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="selectRole" class="col-sm-2 col-form-label">Senders Role</label>
                    <div class="col">
                        <select id="selectRole" class="form-select" aria-label="Role Selector">
                            <option>Select Role</option>
                            <option value="1">Module lead</option>
                            <option value="2" selected>Administrator</option>
                            <option value="3">Module assistant</option>
                        </select>
                        <span class="form-text">
                            (module lead, administrator, module assistant)
                        </span>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputSubjectLine" class="col-sm-2 col-form-label">Subject Line</label>
                    <div class="col">
                        <input type="text" id="inputSubjectLine" class="form-control"
                            placeholder="e.g revision time table" aria-label="Subject Line" value="Exam Revision timetable ">
                        <span class="form-text">
                            (Must be no longer than 5 words)
                        </span>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="subjectContent" class="col-sm-2 col-form-label">Content</label>
                    <div class="col">
                        <textarea class="form-control" placeholder="e.g please make sure that you revise using this revision table"
                            id="subjectContent" >When you are revising, please make sure you make a revision timetable</textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="SelectTimeAndDate" class="col-sm-2 col-form-label">Time and Date</label>
                    <div class="col">
                        <input type="time" class="form-control" id="SelectTimeAndDate" aria-label="Time" value="13:00">
                    </div>
                    <div class="col">
                        <input type="date" class="form-control" id="SelectTimeAndDate" aria-label="Date" value="2026-07-07">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="SelectAttachment" class="col-sm-2 col-form-label">Attachment</label>
                    <div class="col">
                        <input class="form-control" type="file" id="SelectAttachment" aria-label="attachment">
                        <span class="form-text" value="Revision timetable">
                            (Optional)
                        </span>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="SelectPriority" class="col-sm-2 col-form-label">Priority</label>
                    <div class="col">
                        <select id="SelectPriority" class="form-select" aria-label="Priority Selector">
                            <option selected>Select Priority</option>
                            <option value="1">High</option>
                            <option value="2">Normal</option>
                            <option value="3" selected>Low</option>
                        </select>
                        <span class="form-text">
                            (High/Normal/Low)
                        </span>
                        <div class="row">
                    <div class="col p-2">
                        <button type="button" class="submit btn btn-primary">Submit Announcment</button>
                    </div>
            </form>
        </div>
    </main>
</body>

</html>
