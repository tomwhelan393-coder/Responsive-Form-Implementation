<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="row">
                <div class="col-4">
                    <img src="EduMax_logo.png" alt="EduMax logo" class="image img-fluid p-2">
                </div>
                <div class="col-5 d-flex justify-content-center align-items-center">
                    <h1 class="header">EduMax Admin View</h1>
                </div>
                <div class="col-3 text-end">
                    <a class="btn btn-primary m-2 p- btn-lg" role="button">Login</a>
                </div>
            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg p-2 bg-dark" data-bs-theme="dark">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link">Home</a>
                    <a class="nav-link">Module Catologue</a>
                    <a class="nav-link">Learning Events</a>
                    <a class="nav-link ">Membership</a>
                    <a class="nav-link ">News</a>
                    <a class="nav-link" aria-current="page">Announcments</a>
                    <a class="nav-link">Security</a>
                </div>
            </div>
            <form class="d-flex" role="search" data-bs-theme="light">
                <input class="form-control me-2 p-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-secondary" type="submit">Search</button>
            </form>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
